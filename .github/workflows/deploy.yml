name: Deploy (Railway API)

# 検証環境(staging)は claude/ove-wallet-platform への push で自動デプロイし、
# 本番(production)は workflow_dispatch による手動実行のみとする。
# 本番を手動のままにしているのは、apps/api/docker-entrypoint.sh がコンテナ起動時に
# `prisma migrate deploy` を実行するため、マージがそのままDBマイグレーションの実行に
# なるからで、まず検証環境で同じマイグレーションを通してから本番へ入れられるようにする。
#
# 自動実行されるのはAPIのビルドに関わるパスが変わったときだけ (下記 paths)。
# フロントエンド(user-wallet/admin-wallet)だけの変更でAPIコンテナを再起動しても
# 意味がなく、短時間とはいえ無用な断が生じるため対象から外している。
# フロントエンドはVercelのGit連携で自動デプロイされる (docs/deployment.md参照)。
#
# 手動実行では app_url / admin_url を指定してAPIのCORS設定を更新できる。
# 自動実行では両者とも空になり、Railway側の既存値をそのまま残す
# (URLは初回デプロイで設定済みで、以後変わらないため)。
#
# なおデプロイ操作をGitHub Actionsのランナー上で行っているのは、開発コンテナの
# ネットワークポリシーが backboard.railway.com への直接アクセスを禁止しており、
# セッション内から railway CLI を実行できないため (docs/deployment.md)。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先。production は本番ガードが有効になり、別のRailwayプロジェクトを使う"
        type: choice
        options:
          - staging
          - production
        default: staging
      app_url:
        description: "user-walletのURL (production では必須)"
        type: string
        default: ""
      admin_url:
        description: "admin-walletのURL (production では必須)"
        type: string
        default: ""
      run_seed_on_boot:
        description: "起動のたびにseedを実行するか。本番は初回のみtrue、以後falseを推奨"
        type: boolean
        default: true
  push:
    branches:
      - claude/ove-wallet-platform
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "railway.json"
      - ".github/workflows/deploy.yml"

# デプロイ同士が重ならないようにする。同じRailwayサービスに対して
# `railway variable set` と `railway up` が交互に走ると、後から始まった実行の
# 変数設定が先の実行のデプロイに紛れ込む。デプロイ先ごとに直列化する。
# 進行中のデプロイは打ち切らない (cancel-in-progress: false)。
# マイグレーションの途中でジョブを止めると、DBが中途半端な状態のまま残るため。
concurrency:
  group: deploy-api-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  # 自動デプロイのときだけ、同じコミットに対するCI(test)の成功を待つ。
  # ci.yml も claude/ove-wallet-platform への push で走るため、待たずに進めると
  # テストが落ちるコミットでも20分近いRailwayのビルドが走り、
  # docker-entrypoint.sh の `prisma migrate deploy` まで到達してしまう。
  #
  # 手動実行(workflow_dispatch)では待たない。手動実行は「CIの結果に関わらず
  # 今すぐ入れ直したい」障害対応で使う経路なので、ここで塞ぐと復旧の妨げになる。
  wait-for-ci:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 同じ head_sha に対する CI ワークフローの実行を探す。
          #   missing : まだ実行が登録されていない (pushの直後に起こりうる)
          #   running : 実行中
          #   それ以外: conclusion (success / failure / cancelled ...)
          for i in $(seq 1 40); do
            # APIの一時的な失敗でデプロイを止めないよう、失敗は missing 扱いにして
            # 再試行に回す (`if !` にすることで set -e の即時終了も避ける)。
            if ! STATE=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | .[0]
                    | if . == null then "missing"
                      elif .status != "completed" then "running"
                      else .conclusion end'); then
              STATE="missing"
            fi

            case "$STATE" in
              success)
                echo "CIが成功しました (試行 $i)"
                exit 0
                ;;
              missing|running)
                echo "試行 $i: CIの状態は $STATE です。30秒待って再確認します"
                sleep 30
                ;;
              *)
                echo "::error::このコミットのCIが $STATE で終了したため、デプロイを中止しました。"
                echo "CIを直してから再度pushするか、緊急時は Actions から手動実行してください"
                echo "(手動実行はこの待ち合わせを行いません)。"
                exit 1
                ;;
            esac
          done

          echo "::error::20分待ってもCIが完了しませんでした。デプロイを中止します。"
          exit 1

  deploy-api:
    # wait-for-ci は手動実行ではスキップされる。needs だけを書くと、
    # スキップされた依存を持つジョブもスキップされてしまうため、
    # always() を挟んで「成功 または スキップ」を明示的に許可する。
    needs: [wait-for-ci]
    if: ${{ always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    # 本番と検証で**別のGitHub Environment**を使う。同じEnvironmentを共有すると
    # SESSION_SECRET と ENCRYPTION_KEY が検証用と同じ値になり、検証環境の値が
    # 漏れたとき本番のセッションと暗号化データまで影響が及ぶ。Environmentを
    # 分ければSecret名は同じまま値だけが変わる (docs/runbooks/production-launch.md)。
    environment: ${{ inputs.target == 'production' && 'Production' || 'RAILWAY' }}
    # push で起動したときは inputs が空になるため、ここで既定値を確定させる。
    # 以降のステップは inputs ではなくこの env を参照する。
    #   TARGET            : push は必ず staging (本番は手動実行のみ)
    #   RUN_SEED_ON_BOOT  : push では false。seedは初回デプロイで済んでおり、
    #                       毎マージのたびに走らせる必要がない
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      RUN_SEED_ON_BOOT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed_on_boot || false }}
    outputs:
      api_url: ${{ steps.domain.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      # 本番は起動時に APP_URL / ADMIN_URL を必須とする (assertProductionEnvSafe)。
      # 未指定のままデプロイすると、CORS設定を更新する後段のジョブに辿り着く前に
      # APIが起動時エラーで落ちるため、ここで先に止めて理由を示す。
      #
      # Secretの有無もここで確かめる。Production Environment が未作成のまま実行すると
      # GitHubが空のEnvironmentを自動生成し、`railway whoami` が認証エラーで落ちる等の
      # 分かりにくい失敗になるため、原因を名指しして止める。
      - name: Validate inputs
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          set -e
          echo "event=${{ github.event_name }}"
          echo "target=$TARGET"
          echo "GitHub Environment=${{ inputs.target == 'production' && 'Production' || 'RAILWAY' }}"

          if [ "$TARGET" != "production" ]; then
            exit 0
          fi

          FAILED=false

          if [ -z "${{ inputs.app_url }}" ] || [ -z "${{ inputs.admin_url }}" ]; then
            echo "::error::production では app_url と admin_url が必須です。"
            echo "NODE_ENV=production では assertProductionEnvSafe() が両者を必須にしており、"
            echo "未設定のままだとAPIが起動時に失敗します (apps/api/src/common/assert-production-env.ts)。"
            FAILED=true
          fi

          # RAILWAY_PROJECT_ID は Environment ごとに別の値。Production Environment には
          # 本番用プロジェクトのIDを入れる (検証用プロジェクトを指さないこと)。
          REQUIRED="RAILWAY_API_TOKEN RAILWAY_PROJECT_ID SESSION_SECRET ENCRYPTION_KEY"
          if [ "$RUN_SEED_ON_BOOT" = "true" ]; then
            REQUIRED="$REQUIRED SEED_ADMIN_PASSWORD"
          fi
          for NAME in $REQUIRED; do
            if [ -z "$(printenv "$NAME" || true)" ]; then
              echo "::error::production では Secret $NAME が必須ですが、Production Environment に登録されていません。"
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "--------------------------------------------------------------"
            echo "Settings > Environments > Production に Secret を登録してください。"
            echo "手順は docs/runbooks/production-launch.md にあります。"
            echo "SESSION_SECRET と ENCRYPTION_KEY は検証用 (RAILWAY Environment) と"
            echo "**別の値**にしてください。"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ここで落ちる原因はほぼ「トークンのスコープ違い」で、値の打ち間違いではない。
      # Railwayのトークン発行画面はWorkspace欄を選ばせようとするが、選ぶと
      # **チームスコープ**のトークンになり、アカウント情報を読む `whoami` は
      # Unauthorized になる。必要なのはWorkspace欄を空のまま発行した
      # **アカウントスコープ**のトークン (docs/runbooks/production-launch.md)。
      - name: Authenticate
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if railway whoami; then
            exit 0
          fi
          echo "::error::RAILWAY_API_TOKEN で認証できませんでした。"
          echo "--------------------------------------------------------------"
          echo "多いのはトークンの種類違いです。以下を確認してください。"
          echo ""
          echo "1. https://railway.com/account/tokens で発行したものか"
          echo "   (プロジェクトのSettings側で発行するトークンは別物で、"
          echo "    変数名も RAILWAY_TOKEN です)"
          echo "2. 発行時に **Workspace(Team)の欄を空のまま** にしたか"
          echo "   ワークスペースを選ぶとチームスコープになり、アカウント情報を読む"
          echo "   whoami は Unauthorized になります。空のまま発行したものが"
          echo "   アカウントスコープのトークンです"
          echo "3. 前後に空白や改行が混ざっていないか"
          echo ""
          echo "詳細: docs/runbooks/production-launch.md"
          exit 1

      - name: Link or create Railway project
        id: link
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          # 本番と検証は**別のRailwayプロジェクト**を使う。同じDBを共有すると、検証中に
          # 作られたアカウント・取引が本番の会計数値に混ざる (ove_transactions は
          # DBトリガーで削除できないため、後から取り除けない)。
          # 別プロジェクトを指すのは、Environment (RAILWAY / Production) ごとに
          # RAILWAY_PROJECT_ID の値が違うため。ここでの分岐は不要。
          PROJECT_ID="${{ secrets.RAILWAY_PROJECT_ID }}"

          if [ -n "$PROJECT_ID" ]; then
            echo "既存プロジェクトにリンクします: $PROJECT_ID"
            railway link --project "$PROJECT_ID" --environment production
          else
            # productionはValidate inputsで既に弾いているため、ここへ来るのはstagingのみ。
            echo "新規プロジェクトを作成します (初回のみ)"
            railway init --name ove-wallet-api --json | tee init-output.json
            echo "=================================================================="
            echo "重要: 上記JSONに含まれるプロジェクトIDを、GitHub Secretsの"
            echo "RAILWAY Environment に RAILWAY_PROJECT_ID として登録してください"
            echo "(本番用は Production Environment 側なので、間違えないこと)。"
            echo "次回以降の実行で同じプロジェクトを再利用するために必要です。"
            echo "=================================================================="
          fi
          railway status --json || true

      - name: Ensure PostgreSQL, Redis, and the api service exist
        id: databases
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          # サービス名だけを1行1件で取り出す。一覧取得に失敗した場合は空を返し、
          # 「1件も無い」ではなく後段の待機ループで再試行させる。
          service_names() {
            railway service list --json 2>/dev/null | node -e "
              let d='';
              process.stdin.on('data', (c) => { d += c; });
              process.stdin.on('end', () => {
                try {
                  const s = JSON.parse(d);
                  if (Array.isArray(s)) s.forEach((x) => console.log(x.name));
                } catch (e) {
                  // 一覧が取れなかった場合は何も出力しない (待機ループが再試行する)
                }
              });
            "
          }

          NAMES=$(service_names)
          echo "既存サービス: $(echo "$NAMES" | tr '\n' ' ')"

          if echo "$NAMES" | grep -qi "postgres"; then
            echo "PostgreSQLは既に存在します"
          else
            echo "PostgreSQLを追加します"
            railway add --database postgres --json
          fi

          if echo "$NAMES" | grep -qi "redis"; then
            echo "Redisは既に存在します"
          else
            echo "Redisを追加します"
            railway add --database redis --json
          fi

          # railway up --service api で後からデプロイできるよう、空のサービスを先に作る
          # (railway variable set --service api は、サービスが存在しないと失敗するため)。
          # 名前は完全一致で判定する ("api" を含む別サービスを誤検出しないため)。
          if echo "$NAMES" | grep -qx "api"; then
            echo "apiサービスは既に存在します"
          else
            echo "apiサービスを追加します"
            railway add --service api --json
          fi

      # `railway add` が戻ってきても、そのサービスが `railway service list` に現れる
      # までに時間差がある。本番の初回デプロイで、Redisを作成した21秒後の一覧にまだ
      # 現れず「redis service not found」で失敗した (Postgresとapiは現れていた)。
      # 固定の sleep ではなく、3つとも一覧に現れるまで待つ。
      - name: Wait for the services to appear
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          for i in $(seq 1 30); do
            NAMES=$(railway service list --json 2>/dev/null | node -e "
              let d='';
              process.stdin.on('data', (c) => { d += c; });
              process.stdin.on('end', () => {
                try {
                  const s = JSON.parse(d);
                  if (Array.isArray(s)) s.forEach((x) => console.log(x.name));
                } catch (e) {}
              });
            ")
            MISSING=""
            echo "$NAMES" | grep -qi "postgres" || MISSING="$MISSING postgres"
            echo "$NAMES" | grep -qi "redis" || MISSING="$MISSING redis"
            echo "$NAMES" | grep -qx "api" || MISSING="$MISSING api"
            if [ -z "$MISSING" ]; then
              echo "試行 $i: 3サービスとも確認できました ($(echo "$NAMES" | tr '\n' ' '))"
              exit 0
            fi
            echo "試行 $i: 未反映 ->$MISSING (現在: $(echo "$NAMES" | tr '\n' ' '))。10秒待ちます"
            sleep 10
          done
          echo "::error::5分待ってもサービスが揃いませんでした ->$MISSING"
          echo "Railwayのダッシュボードでプロジェクトの状態を確認してください。"
          echo "同名のサービスが重複していないかも合わせて確認してください。"
          exit 1

      - name: Read DATABASE_URL / REDIS_URL and set API service variables
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          echo "サービス一覧を確認します:"
          railway service list --json | tee services.json

          POSTGRES_SERVICE=$(node -e "
            const s = require('./services.json');
            const found = s.find(x => /postgres/i.test(x.name));
            if (!found) { console.error('postgres service not found'); process.exit(1); }
            console.log(found.name);
          ")
          REDIS_SERVICE=$(node -e "
            const s = require('./services.json');
            const found = s.find(x => /redis/i.test(x.name));
            if (!found) { console.error('redis service not found'); process.exit(1); }
            console.log(found.name);
          ")
          echo "postgres service: $POSTGRES_SERVICE"
          echo "redis service: $REDIS_SERVICE"

          # サービスが一覧に現れても、接続情報の変数が入るまでにさらに時間差がある。
          # 揃うまで待ってから先へ進む (空のまま進むとAPIが起動時に落ちるため)。
          read_var() {
            railway variable list --service "$1" --json 2>/dev/null | node -e "
              let d='';
              process.stdin.on('data', (c) => { d += c; });
              process.stdin.on('end', () => {
                try {
                  const v = JSON.parse(d);
                  console.log(v['$2'] || v['$3'] || '');
                } catch (e) {
                  console.log('');
                }
              });
            "
          }

          for i in $(seq 1 24); do
            DATABASE_URL=$(read_var "$POSTGRES_SERVICE" DATABASE_URL DATABASE_PUBLIC_URL)
            REDIS_URL=$(read_var "$REDIS_SERVICE" REDIS_URL REDIS_PUBLIC_URL)
            if [ -n "$DATABASE_URL" ] && [ -n "$REDIS_URL" ]; then
              echo "試行 $i: DATABASE_URL と REDIS_URL を取得しました"
              break
            fi
            MISSING=""
            [ -n "$DATABASE_URL" ] || MISSING="$MISSING DATABASE_URL"
            [ -n "$REDIS_URL" ] || MISSING="$MISSING REDIS_URL"
            echo "試行 $i: 未取得 ->$MISSING。10秒待ちます"
            sleep 10
          done

          if [ -z "$DATABASE_URL" ] || [ -z "$REDIS_URL" ]; then
            echo "::error::4分待っても DATABASE_URL / REDIS_URL を取得できませんでした。"
            echo "Railwayのダッシュボードで Postgres / Redis サービスが正常に"
            echo "起動しているか確認してください。"
            exit 1
          fi

          railway variable set "DATABASE_URL=$DATABASE_URL" --service api --skip-deploys --json
          railway variable set "REDIS_URL=$REDIS_URL" --service api --skip-deploys --json
          railway variable set "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" --service api --skip-deploys --json
          railway variable set "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" --service api --skip-deploys --json
          railway variable set "SEED_ADMIN_PASSWORD=${{ secrets.SEED_ADMIN_PASSWORD }}" --service api --skip-deploys --json
          # 起動のたびにseedを走らせるか。本番は初回だけtrueにし、初期管理者を作ったら
          # falseへ戻すことを推奨する (SEED_ADMIN_PASSWORDを環境変数に置き続けない、
          # 意図せぬ再作成を避ける、起動時間を伸ばさない、の3点のため)。
          railway variable set "RUN_SEED_ON_BOOT=$RUN_SEED_ON_BOOT" --service api --skip-deploys --json
          # 実チャネルでのLIFF結合試験(2026-07-18)でLINE本番ログインの動作を確認済み。
          # LINE_CHANNEL_IDと合わせてLineIdTokenVerifierが使われる (docs/authentication.md)。
          railway variable set "AUTH_MODE=production" --service api --skip-deploys --json

          # NODE_ENV=production で本番ガードが有効になる:
          #   - assertProductionEnvSafe(): REDIS_URL/ENCRYPTION_KEY/LINE_CHANNEL_ID/
          #     APP_URL/ADMIN_URL が未設定なら起動を中止する
          #   - assertAuthModeSafeForProduction(): AUTH_MODE=production を必須にする
          #   - 千ノ国パスポートSSOのモック発行エンドポイントが404になる
          #   - メールOTPの devCode を応答に含めなくなる
          # stagingではこれらが素通りするため、検証用デプロイは staging のままにする。
          if [ "$TARGET" = "production" ]; then
            railway variable set "NODE_ENV=production" --service api --skip-deploys --json
          else
            railway variable set "NODE_ENV=staging" --service api --skip-deploys --json
          fi

          # 稼働開始時点で使えるログイン方法はLINEのみ (docs/login-methods.md)。
          # メールは送信基盤が未実装、SSOは未接続のため、明示的に閉じておく
          # (既定でも閉じているが、環境変数を見れば状態が分かるようにする)。
          railway variable set "ENABLE_EMAIL_LOGIN=false" --service api --skip-deploys --json
          railway variable set "ENABLE_SENGOKU_PASSPORT_LOGIN=false" --service api --skip-deploys --json
          railway variable set "ENABLE_AGENCY_LOGIN=false" --service api --skip-deploys --json

          # APP_URL / ADMIN_URL は本番ガードの必須項目であり、CORSとCSRFの許可オリジンの
          # 唯一の入力でもある。後段のジョブではなく**デプロイ前**に設定する
          # (production では未設定だと初回起動に失敗するため)。
          if [ -n "${{ inputs.app_url }}" ] && [ -n "${{ inputs.admin_url }}" ]; then
            APP_URL="${{ inputs.app_url }}"
            ADMIN_URL="${{ inputs.admin_url }}"
            # ブラウザのOriginヘッダーは末尾スラッシュを含まないため揃える
            railway variable set "APP_URL=${APP_URL%/}" --service api --skip-deploys --json
            railway variable set "ADMIN_URL=${ADMIN_URL%/}" --service api --skip-deploys --json
          fi
          railway variable set "HIGH_VALUE_THRESHOLD=50000" --service api --skip-deploys --json
          # SENTRY_DSN未設定 (シークレット未登録) の場合は空文字列がセットされるだけで、
          # apps/api/src/common/sentry.tsのinitSentry()は空の場合何もしない安全側の
          # 挙動なので、シークレット未登録でもデプロイ自体は失敗しない。
          railway variable set "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" --service api --skip-deploys --json
          # LINE Developersで発行したチャネルID (シークレットではない、LIFF初期化等で
          # クライアント側にも露出する値のため直接埋め込む)。上記でAUTH_MODE=productionへ
          # 切り替えたため、この値がLineIdTokenVerifierの検証先として実際に参照される。
          railway variable set "LINE_CHANNEL_ID=2010749243" --service api --skip-deploys --json
          # ビルド方法をDockerfileに固定する。Railwayの既定はrailpackによる自動判定で、
          # このモノレポでは「Nx workspace with a Next.js app」と誤認して
          # `RAILPACK_NX_APP を設定してください` というエラーでビルドに失敗した
          # (本番の初回デプロイ, run #38)。
          #
          # リポジトリルートの `railway.json` は builder=DOCKERFILE を指定しているが、
          # 空サービスとして作った service には効かなかった (Config as Code自体も
          # 2026-12-01で廃止予定という警告が出ている)。サービス変数で明示するのが
          # 現在の推奨方法なので、ワークフロー側で必ず設定する。
          # https://docs.railway.com/builds/dockerfiles
          #
          # パスはリポジトリルートからの相対。Dockerfile側もルートをビルド
          # コンテキストとして想定している (apps/api/Dockerfile 冒頭のコメント)。
          railway variable set "RAILWAY_DOCKERFILE_PATH=apps/api/Dockerfile" --service api --skip-deploys --json
          # RailwayはPORTを自動注入しないため、Dockerfileの`EXPOSE 4000`と
          # main.tsのリッスンポートに合わせて明示的に設定する。これが無いと
          # Railwayのエッジ/ヘルスチェックがどのポートに到達すればよいか分からず、
          # コンテナは正常に起動していても「service unavailable」になる。
          railway variable set "PORT=4000" --service api --skip-deploys --json
          # 稼働中のコンテナがどのビルドかを /health から判別できるようにする。
          # これが無いと、`railway up --detach` の直後にまだ動いている旧コンテナが
          # 200を返し、入れ替わる前にデプロイ成功と判定してしまう (run #39 で発生)。
          railway variable set "GIT_COMMIT_SHA=${{ github.sha }}" --service api --skip-deploys --json

      - name: Deploy API service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --service api --ci --detach

      - name: Generate public domain
        id: domain
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          # 初回はドメインを新規発行、既に存在する場合(再実行時)は一覧から取得する
          railway domain --service api --json > domain-output.json 2>&1 || railway domain list --service api --json > domain-output.json
          cat domain-output.json
          DOMAIN_URL=$(node -e "
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('domain-output.json', 'utf8')); } catch (e) { console.log(''); process.exit(0); }
            const list = Array.isArray(data) ? data : (data.domains || [data]);
            const first = list[0];
            if (!first) { console.log(''); process.exit(0); }
            const val = (typeof first === 'string') ? first : (first.domain || first.url || '');
            console.log(val && !val.startsWith('http') ? 'https://' + val : val);
          ")
          if [ -z "$DOMAIN_URL" ]; then
            echo "ドメインの取得に失敗しました。domain-output.jsonを確認してください。"
            exit 1
          fi
          echo "api_url=$DOMAIN_URL" >> "$GITHUB_OUTPUT"
          echo "API URL: $DOMAIN_URL"

      # `railway up --detach` はビルド完了を待たずに戻る。ここで待つのは
      # 「イメージのビルド → プッシュ → コンテナ起動 → prisma migrate deploy →
      # (初回のみ) seed → listen」の全部で、**初回はDockerのレイヤキャッシュが
      # 無いぶん特に長い**。本番の初回デプロイは5分では足りず、404のまま
      # タイムアウトした (実際にはビルド中だった) ため20分まで待つ。
      #
      # 404はRailwayのエッジが「稼働中のデプロイが無い」ときに返す。つまり
      # ビルド中か、ビルドに失敗している。502/503はコンテナが起動していない、
      # 000は到達自体できていない、を意味するので、切り分け用に表示を分ける。
      - name: Wait for API to become healthy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          URL="${{ steps.domain.outputs.api_url }}/health"
          # /health が返す短縮SHA (health.controller.ts) と突き合わせる。
          # 200を返したかどうかだけでは、まだ動いている**旧コンテナ**の応答と
          # 区別できない (`railway up --detach` はビルド完了を待たずに戻るため)。
          EXPECTED=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "確認先: $URL"
          echo "このデプロイのコミット: $EXPECTED"
          ATTEMPTS=120
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -sS -o /tmp/health-body.txt -w "%{http_code}" "$URL" || echo "000")
            ACTUAL=""
            case "$CODE" in
              200)
                ACTUAL=$(jq -r '.commit // ""' /tmp/health-body.txt 2>/dev/null || echo "")
                if [ "$ACTUAL" = "$EXPECTED" ]; then
                  echo "新しいビルドが稼働しています:"
                  cat /tmp/health-body.txt
                  exit 0
                fi
                NOTE=" (まだ旧いコンテナが応答しています: commit=${ACTUAL:-未設定})"
                ;;
              404) NOTE=" (稼働中のデプロイがまだ無い。ビルド中か、ビルド失敗)" ;;
              502|503) NOTE=" (コンテナがまだ応答していない。起動中か、起動に失敗)" ;;
              000) NOTE=" (接続できず)" ;;
              *) NOTE="" ;;
            esac
            echo "試行 $i/$ATTEMPTS ($((i * 10))秒経過): HTTP $CODE$NOTE"
            sleep 10
          done
          echo "::error::20分待っても新しいビルド ($EXPECTED) が稼働しませんでした。"
          echo "Railwayのダッシュボードで api サービスの Deployments を確認してください。"
          echo "ビルド中のまま20分を超えている場合は、そのまま完了を待ってから"
          echo "/health を直接開けば稼働状況が分かります。"
          echo "=================================================="
          echo "直近のビルドログ:"
          railway logs --service api --build --lines 100 --latest || true
          echo "=================================================="
          echo "直近のデプロイ(ランタイム)ログ:"
          railway logs --service api --deployment --lines 200 --latest || true
          exit 1

  # APP_URL / ADMIN_URL は1つ目のジョブがデプロイ前に設定済み (production では未設定だと
  # 起動に失敗するため)。このジョブは同じ値を再適用して再起動する念のための後処理で、
  # 設定の正本ではない。フロントのURLだけを後から差し替えたい場合にも使える。
  update-api-cors:
    needs: deploy-api
    if: ${{ inputs.app_url != '' && inputs.admin_url != '' }}
    runs-on: ubuntu-latest
    # 1つ目のジョブと同じEnvironment (同じSecret群) を使う
    environment: ${{ inputs.target == 'production' && 'Production' || 'RAILWAY' }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Update APP_URL / ADMIN_URL and restart API
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          # 1つ目のジョブと同じプロジェクトを選ぶ。Environmentが同じなので
          # RAILWAY_PROJECT_ID も同じ値を指す。
          railway link --project "${{ secrets.RAILWAY_PROJECT_ID }}" --environment production
          # ブラウザのOriginヘッダーは末尾スラッシュを含まないため、CORSの許可リストと
          # 比較するURLも末尾スラッシュを除去しておく(付いたままだと一致せず、
          # Access-Control-Allow-Originが返らずCORSエラーになる)。
          APP_URL="${{ inputs.app_url }}"
          ADMIN_URL="${{ inputs.admin_url }}"
          APP_URL="${APP_URL%/}"
          ADMIN_URL="${ADMIN_URL%/}"
          echo "APP_URL=$APP_URL"
          echo "ADMIN_URL=$ADMIN_URL"
          # 両方とも--skip-deploysで設定してから、railway upで明示的に再デプロイする。
          # (railway service restartは「Deployment is not restartable」で失敗する
          # ケースがあり信頼できなかったため、deploy-apiジョブと同じ確実な経路である
          # railway upに統一した)
          railway variable set "APP_URL=$APP_URL" --service api --skip-deploys --json
          railway variable set "ADMIN_URL=$ADMIN_URL" --service api --skip-deploys --json
          railway up --service api --ci --detach
          echo "app_url=$APP_URL" >> "$GITHUB_ENV"
          echo "admin_url=$ADMIN_URL" >> "$GITHUB_ENV"

      - name: Wait for the new deployment's CORS headers to go live
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -e
          # `railway up --ci --detach`はビルド完了を待たずに戻るため、直後の
          # /healthチェックは(新しいデプロイではなく)まだ稼働中の古いインスタンスに
          # 当たって200を返してしまい、正しく待てていなかった。ここでは
          # /healthではなく実際にCORSヘッダーがAPP_URL/ADMIN_URLを反映しているかを
          # 新デプロイが有効になるまでリトライし続けることで、確実に入れ替わりを待つ。
          API_URL="${{ needs.deploy-api.outputs.api_url }}"
          for i in $(seq 1 30); do
            OK=true
            for ORIGIN in "$app_url" "$admin_url"; do
              HEADERS=$(curl -sS -i -X OPTIONS \
                -H "Origin: $ORIGIN" \
                -H "Access-Control-Request-Method: GET" \
                "$API_URL/api/v1/accounts/me")
              if ! echo "$HEADERS" | grep -qi "access-control-allow-origin: $ORIGIN"; then
                OK=false
              fi
            done
            if [ "$OK" = "true" ]; then
              echo "試行 $i: 新しいCORS設定が反映されました"
              exit 0
            fi
            echo "試行 $i: まだ古いインスタンスが応答しています。10秒待って再試行します"
            sleep 10
          done
          echo "5分待っても新しいCORS設定が反映されませんでした。直近のデプロイログ:"
          railway logs --service api --deployment --lines 100 --latest || true
          exit 1

      - name: Summary
        run: |
          echo "### CORS設定を更新しました" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ needs.deploy-api.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APP_URL: $app_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- ADMIN_URL: $admin_url" >> "$GITHUB_STEP_SUMMARY"
